<script>

================================================================ */

const REPORT_BASE = "/multi-tenant-reports/";

    "hb-us",
    "bk-co",
    "por-us",
    "enp-us",
    "bk-cr"
];

const environments = [
    "dev-a",
    "dev-b",
    "qa-a",
    "qa-b",
    "demo-a",
    "demo-b",
    "prod"

/* Existing Playwright configuration */
const playwrightTenants = [
    "jm-demo",
    "jm-uk",
    "kfc-gt"
];

const playwrightEnvironments = [

    "dev-b",
    "qa-a",
    "qa-b",
    "demo",
    "prod"

    "dev-a",
    "dev-b",
    "qa-a",
    "qa-b",
    "demo-a",
    "demo-b",
    "prod"
];

const ORDER_ALERT_DEFAULT_ENV = "qa-b";

/* ================================================================
   HTML ESCAPING
================================================================ */

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* ================================================================
   REPORT URL PARSER
================================================================ */

function parseReportUrl(url) {
    const cleanUrl = String(url).replace(/\/+$/, "");
    const parts = cleanUrl.split("/").filter(Boolean);

    const result = {
        build: "Unknown",
        suite: ""
    };

    if (parts.length === 0) {
        return result;
    }

    const lastSegment = parts[parts.length - 1];

    if (!/^\d+$/.test(lastSegment)) {
        try {
            result.suite = decodeURIComponent(lastSegment);
        } catch (error) {
            result.suite = lastSegment;
        }

        if (parts.length >= 2) {
            const buildSegment = parts[parts.length - 2];

            if (/^\d+$/.test(buildSegment)) {
                result.build = buildSegment;
            }
        }
    } else {
        result.build = lastSegment;
    }

    return result;
}

/* ================================================================
   LOAD REPORTS
================================================================ */

function loadReports(jsonFile, elementId) {
    const target = document.getElementById(elementId);

    if (!target) {
        console.error("Report container not found:", elementId);
        return;
    }

    target.innerHTML = '<li class="no-reports">Loading reports...</li>';

    $.getJSON(jsonFile)
        .done(function (data) {
            const targetElement = document.getElementById(elementId);

            if (!targetElement) {
                return;
            }

            const reports = Array.isArray(data.reports)
                ? [...new Set(data.reports.filter(
                    url => typeof url === "string" && url.trim() !== ""
                ))]
                : [];

            reports.sort(function (a, b) {
                const aReport = parseReportUrl(a);
                const bReport = parseReportUrl(b);

                return (
                    (parseInt(bReport.build, 10) || 0) -
                    (parseInt(aReport.build, 10) || 0)
                );
            });

            if (reports.length === 0) {
                targetElement.innerHTML =
                    '<li class="no-reports">No reports found</li>';
                return;
            }

            targetElement.innerHTML = reports.map(function (url) {
                const report = parseReportUrl(url);
                const displayText = `Test Report ${report.build}`;
                const safeUrl = escapeHtml(url);

                const suiteHtml = report.suite
                    ? ` <span class="suite-name">(${escapeHtml(report.suite)})</span>`
                    : "";

                return `
                    <li>
                        ⚡
                        <a
                            class="report-link"
                            href="${safeUrl}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >${displayText}${suiteHtml}</a>
                    </li>
                `;
            }).join("");
        })
        .fail(function (jqXHR, textStatus, errorThrown) {
            const targetElement = document.getElementById(elementId);

            if (targetElement) {
                targetElement.innerHTML =
                    '<li class="no-reports">No reports found</li>';
            }

            console.warn(
                "Unable to load report JSON:",
                jsonFile,
                textStatus,
                errorThrown
            );
        });
}

/* ================================================================
   EXISTING ENVIRONMENT DROPDOWN
================================================================ */

function getEnvironmentDropdown(
    tenant,
    platform,
    reportType,
    targetPrefix
) {
    const options = environments.map(function (env) {
        return `
            <option
                value="${env}"
                ${env === DEFAULT_ENV ? "selected" : ""}
            >${env.toUpperCase()}</option>
        `;
    }).join("");

    return `
        <div class="env-selector">
            <label><strong>Environment</strong></label>
            <select
                class="form-control"
                onchange="loadEnvironmentReports(
                    '${tenant}',
                    '${platform}',
                    this.value,
                    '${reportType}',
                    '${targetPrefix}'
                )"
            >
                ${options}
            </select>
        </div>
    `;
}

/* ================================================================
   EXISTING PLAYWRIGHT ENVIRONMENT DROPDOWN
================================================================ */

}

                    '${tenant}',
                    this.value,

                    '${targetPrefix}'

            >
                ${options}

/* ================================================================

================================================================ */

function createWebTenantSection() {
    const container = document.getElementById("web-tenants");

    let nav = '<ul class="nav nav-pills mb-3">';
    let tabs = '<div class="tab-content">';

    tenants.forEach(function (tenant, index) {
        const active = index === 0 ? "active" : "";
        const idPrefix = `web-${tenant}`;

        nav += `
            <li class="nav-item">
                <a
                    class="nav-link ${active}"
                    data-toggle="pill"
                    href="#${idPrefix}"
                >${tenant.toUpperCase()}</a>
            </li>
        `;

        tabs += `
            <div
                id="${idPrefix}"
                class="tab-pane fade ${active ? "show active" : ""}"
            >
                ${getEnvironmentDropdown(
                    tenant, "web", "existing-web", idPrefix
                )}

                <div class="section-title">Robot Reports</div>

                <div class="report-box">
                    <ul id="${idPrefix}-reports"></ul>
                </div>
            </div>
        `;
    });

    nav += "</ul>";
    tabs += "</div>";

================================================================ */

        const tabId = `${idPrefix}-${tenant}`;

                <a

                    data-toggle="pill"
                    href="#${tabId}"

        `;

        tabs += `
            <div
                id="${tabId}"
                class="tab-pane fade ${active ? "show active" : ""}"
            >
                ${getEnvironmentDropdown(
                    tenant, platform, reportType, tabId
                )}

                <div class="row">
                    <div class="col-md-6">
                        <div class="section-title">Allure Reports</div>
                        <div class="report-box">
                            <ul id="${tabId}-allure"></ul>

/* ================================================================
   LOAD EXISTING ENVIRONMENT REPORTS
================================================================ */

function loadEnvironmentReports(
    tenant,
    platform,
    env,
    reportType,
    targetPrefix
) {
    if (reportType === "existing-web") {
        loadReports(
            `${REPORT_BASE}${tenant}_${env}_robot_reports.json`,
            `${targetPrefix}-reports`
        );
        return;
    }

    if (reportType === "existing-mobile") {
        loadReports(
            `${REPORT_BASE}${tenant}_${env}_${platform}_allure_reports.json`,
            `${targetPrefix}-allure`
        );

        loadReports(
            `${REPORT_BASE}${tenant}_${env}_${platform}_robot_reports.json`,
            `${targetPrefix}-robot`
        );
        return;
    }

    if (reportType === "unify-web") {
        loadReports(
            `${REPORT_BASE}${tenant}_${env}_unify_web_robot_reports.json`,
            `${targetPrefix}-reports`
        );
        return;
    }

    if (reportType === "unify-mobile") {
        loadReports(
            `${REPORT_BASE}${tenant}_${env}_unify_${platform}_allure_reports.json`,
            `${targetPrefix}-allure`
        );

        loadReports(
            `${REPORT_BASE}${tenant}_${env}_unify_${platform}_robot_reports.json`,
            `${targetPrefix}-robot`
        );
    }
}

/* ================================================================
   LOAD EXISTING PLAYWRIGHT REPORTS
================================================================ */

function loadPlaywrightReports(tenant, env, reportType, targetPrefix) {
    let jsonFile = "";

    if (reportType === "non-mutation") {
        jsonFile =
            `${REPORT_BASE}${tenant}_${env}_playwright_non_mutation_robot_reports.json`;
    } else if (reportType === "backoffice-mutation") {
        jsonFile =
            `${REPORT_BASE}${tenant}_${env}_playwright_backoffice_mutation_robot_reports.json`;
    }

    if (!jsonFile) {
        console.error("Unknown Playwright report type:", reportType);
        return;
    }

    loadReports(jsonFile, `${targetPrefix}-reports`);
}

================================================================ */

    }

    if (!jsonFile) {
        console.error("Unknown Order Alert report type:", reportType);
        return;

    loadReports(jsonFile, `${targetPrefix}-reports`);
}
